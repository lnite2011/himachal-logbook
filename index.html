<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Himachal · trip logbook</title>
<meta name="description" content="A private trip logbook for Himachal Pradesh.">
<meta name="theme-color" content="#171b40">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&family=Yatra+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#app">Skip to content</a>

<header class="bar" id="bar">
  <a class="brand" href="#/" aria-label="Himachal logbook, home">
    <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><use href="#i-mark"/></svg>
    <span>Himachal</span>
  </a>
  <div class="bar-actions">
    <button class="icon-btn" id="refresh" title="Fetch the latest from GitHub" aria-label="Refresh content">
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-refresh"/></svg>
    </button>
    <button class="icon-btn" id="menu-btn" aria-expanded="false" aria-controls="drawer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-menu"/></svg><span class="lbl">Chapters</span>
    </button>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<nav class="tabs" aria-label="Quick links">
  <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-compass"/></svg><span>Trail</span></a>
  <a href="#/c/itinerary" data-tab="itinerary"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-scroll"/></svg><span>Days</span></a>
  <a href="#/c/todo" data-tab="todo"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-check"/></svg><span>To do</span></a>
  <a href="#/c/packing" data-tab="packing"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-pack"/></svg><span>Packing</span></a>
  <button type="button" id="tab-more"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-menu"/></svg><span>More</span></button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="All chapters" hidden>
  <div class="drawer-head">
    <strong>The logbook</strong>
    <button class="icon-btn" id="drawer-close" aria-label="Close menu"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"/></svg></button>
  </div>
  <ul id="drawer-list"></ul>
  <div class="drawer-foot">
    <a href="#/credits">Photo credits</a>
    <button type="button" id="lock-btn">Lock this device</button>
  </div>
</aside>

<!-- icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-mark" viewBox="0 0 32 32"><path d="M2 26 11 10l5 8 4-6 10 14Z" fill="currentColor"/><circle cx="23" cy="9" r="3.2" fill="#e9922b"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>

    <symbol id="i-bowl" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18a9 9 0 0 1-18 0Z"/><path d="M9 3c-1 1.500 1 2.500 0 4M14 3c-1 1.500 1 2.500 0 4"/></g></symbol>

  </defs>
</svg>

<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="config.js"></script>

</body>
</html>
